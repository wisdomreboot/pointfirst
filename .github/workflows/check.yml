# Runs on every pull request and every push to main. A red check means the page would not
# boot cleanly under its own security policy, or the page-view counter would not work.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security policy hashes are current
        run: python3 tools/csp.py index.html --check
      - name: Install Chromium
        run: |
          pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Check
        run: python3 tools/check.py
